# Live world M15: as M14 (M12's world with mutual adhesion, birth bonds 0.5,
# less damage per byte, 256-byte genomes, sleep x4) with chemistry worth
# computing: 16 catalysis events per CAT at full folding instead of 4, and
# photolysis (light turning X3 back into X1 + X2) 10x faster. In M14 every
# site held ~2,300 energy of X1+X2 that no program used (CAT was 0.006% of
# program bytes) and light recharged it by only ~0.6 per site and epoch. Now
# an unfolded CAT nets ~+17 energy and a folded one (8 same-hand bytes before
# it) ~+190, and light can recharge up to ~25 per site and epoch at full sun:
# a daylight store that only cells running CAT can spend, most useful at night.
# Start fresh with: --events runs/seed-501.jsonl
preset = "primordia-2d-sun"
seed = 2
epochs = 1000000000

[world]
size = [501, 501]

[individual]
l_max = 256
step_budget = 1024  # a 256-byte copy takes ~1000 steps
starve_after = 800
max_age = 20000  # 10 days
sleep_scale = 4  # PUSH31 SLEEP = 124 epochs
sleep_shield = false
sleep_absorb = 0.0
sleep_upkeep = 0.5

[energy]
share_beta = 0.125

[energy.sun]
i0 = 150
moon = 0.04

[energy.upkeep]
base = 3.5
per_byte = 0.06

[energy.vents]
enabled = true
count = 6
rate = 200000  # 500x the default; heat stays 400
lifetime = 200000  # 100 days
spawn_rate = 4e-5  # with the longer lifetime, keeps ~8 vents
stagger = true  # founding vents start at random ages
floor_only = false
drift = 0.01

[shielding]
s_bond = 0.4

[bonds]
mutual = true
birth_bond = 0.5

[mutation]
background = 1e-4

[chemistry]
n_cat = 16  # events per CAT at full folding (4 by default)

[[chemistry.reactions]]
r = ["X1", "X2"]
p = ["X3"]
energy = 12
catalyzable = true
kind = "mass"
rate = 1e-6
activation = 0.5

[[chemistry.reactions]]  # light recharges the store: 10x the default
r = ["X3"]
p = ["X1", "X2"]
energy = 0
catalyzable = false
kind = "photolysis"
rate = 2e-2
activation = 0.0

[[chemistry.reactions]]
r = ["X4"]
p = ["X3"]
energy = 20
catalyzable = true
kind = "mass"
rate = 1e-5
activation = 0.5

[[chemistry.reactions]]
r = ["X3"]
p = ["X1", "X2"]
energy = -12
catalyzable = false
kind = "mass"
rate = 1e-4
activation = 0.6

[decay]
rate = 5e-5

[telemetry]
snapshot_every = 11000  # alternates midday / dawn
