# Live world M12: as M11 (M4 + s_bond 0.4, share_beta 0.125, sleep at half
# upkeep, sleepers unshielded, moonlight 0.04, vents at 200000 per epoch
# lasting 100 days, 10-day lifespan) with the founding vents starting at
# random ages (energy.vents.stagger). In M11 bodies anchored at vents lived up
# to 32 nights, but all six founding vents were born at epoch 0 and expired
# together on day 100, and every long-lived body died within three days.
# Start fresh with: --events runs/seed-501.jsonl
preset = "primordia-2d-sun"
epochs = 1000000000

[world]
size = [501, 501]

[individual]
starve_after = 800
max_age = 20000  # 10 days
sleep_scale = 16
sleep_shield = false
sleep_absorb = 0.0
sleep_upkeep = 0.5

[energy]
share_beta = 0.125

[energy.sun]
i0 = 150
moon = 0.04

[energy.upkeep]
base = 3.5
per_byte = 0.12

[energy.vents]
enabled = true
count = 6
rate = 200000  # 500x the default; heat stays 400
lifetime = 200000  # 100 days
spawn_rate = 4e-5  # with the longer lifetime, keeps ~8 vents
stagger = true  # founding vents start at random ages
floor_only = false
drift = 0.01

[shielding]
s_bond = 0.4

[decay]
rate = 3e-4

[telemetry]
snapshot_every = 11000  # alternates midday / dawn
