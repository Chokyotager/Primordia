# Live world M14: as M13 (M12's world with mutual adhesion, birth bonds 0.5,
# less damage per byte, 256-byte genomes) with shorter sleeps: SLEEP n lasts
# min(n, 255) x 4 epochs instead of x 16, so a 1000-epoch night takes about
# eight sleep calls (each a slice that runs and pays) instead of two. In M13,
# with decay cut sixfold, a sleeping cell's program survived the night intact
# and sleepers took over from day 12 without the sleep shield (80-90% asleep,
# bonding gone, bodies small), as in M5 and M6.
# Start fresh with: --events runs/seed-501.jsonl
preset = "primordia-2d-sun"
seed = 2
epochs = 1000000000

[world]
size = [501, 501]

[individual]
l_max = 256
step_budget = 1024  # a 256-byte copy takes ~1000 steps
starve_after = 800
max_age = 20000  # 10 days
sleep_scale = 4  # PUSH31 SLEEP = 124 epochs
sleep_shield = false
sleep_absorb = 0.0
sleep_upkeep = 0.5

[energy]
share_beta = 0.125

[energy.sun]
i0 = 150
moon = 0.04

[energy.upkeep]
base = 3.5
per_byte = 0.06

[energy.vents]
enabled = true
count = 6
rate = 200000  # 500x the default; heat stays 400
lifetime = 200000  # 100 days
spawn_rate = 4e-5  # with the longer lifetime, keeps ~8 vents
stagger = true  # founding vents start at random ages
floor_only = false
drift = 0.01

[shielding]
s_bond = 0.4

[bonds]
mutual = true
birth_bond = 0.5

[mutation]
background = 1e-4

[decay]
rate = 5e-5

[telemetry]
snapshot_every = 11000  # alternates midday / dawn
