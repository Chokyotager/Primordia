# Live world M10: as M9 (M4 + s_bond 0.4, share_beta 0.125, sleep at half
# upkeep, sleepers unshielded, moonlight 0.04) with much stronger, longer-lived
# vents: 200000 free energy per epoch (500x the default; heat unchanged),
# lasting 100 days instead of 25, spawning 4x less often so about 8 exist at a
# time. In M9 (8000 per vent) about half the cells survived each night and a
# few small bodies (58-700 cells) sat within 11 cells of a vent, but none
# lasted more than one night. Now each vent can carry ~33,000 cells through the
# night (8 vents ~14% of the solar energy), and an oasis outlasts many
# lifespans of the cells around it.
# Start fresh with: --events runs/seed-501.jsonl
preset = "primordia-2d-sun"
epochs = 1000000000

[world]
size = [501, 501]

[individual]
starve_after = 800
max_age = 6000
sleep_scale = 16
sleep_shield = false
sleep_absorb = 0.0
sleep_upkeep = 0.5

[energy]
share_beta = 0.125

[energy.sun]
i0 = 150
moon = 0.04

[energy.upkeep]
base = 3.5
per_byte = 0.12

[energy.vents]
enabled = true
count = 6
rate = 200000  # 500x the default; heat stays 400
lifetime = 200000  # 100 days
spawn_rate = 4e-5  # with the longer lifetime, keeps ~8 vents
floor_only = false
drift = 0.01

[shielding]
s_bond = 0.4

[decay]
rate = 3e-4

[telemetry]
snapshot_every = 11000  # alternates midday / dawn
