# Live world M6: as M5, plus sleep costs half the normal upkeep instead of 1/8
# (individual.sleep_upkeep 0.5). In M5 a copier that sleeps after every copied
# byte (CPY SLEEP in its loop) took over on day 14 (85% of cells asleep, bodies
# broken up). The running M6 world was resumed from M5's day-11 snapshot:
#   --resume runs/live-m5-s1/snapshots/e0000022000.psnap --set individual.sleep_upkeep=0.5
# Start fresh with: --events runs/seed-501.jsonl
preset = "primordia-2d-sun"
epochs = 1000000000

[world]
size = [501, 501]

[individual]
starve_after = 800
max_age = 6000
sleep_scale = 16
sleep_shield = true
sleep_absorb = 0.0
sleep_upkeep = 0.5

[energy]
share_beta = 0.125

[energy.sun]
i0 = 150
moon = 0.02

[energy.upkeep]
base = 3.5
per_byte = 0.12

[energy.vents]
enabled = true
count = 6
floor_only = false
drift = 0.01

[shielding]
s_bond = 0.4

[decay]
rate = 3e-4

[telemetry]
snapshot_every = 11000  # alternates midday / dawn
