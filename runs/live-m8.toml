# Live world M8: as M7 (M4 + s_bond 0.4, share_beta 0.125, sleep at half
# upkeep, sleepers unshielded) with brighter moonlight (0.02 -> 0.06). In M7
# sleeping vanished and bonding was strongly selected (BOND 10-17x random), but
# the world filled with one giant daytime mat and ~75% of cells died each night:
# moonlight (~3/epoch) could not cover upkeep (~7-11/epoch). At 0.06 (~9/epoch
# at full exposure) an idle cell roughly breaks even at night, so a body that
# shares energy can carry its shaded interior through.
# Start fresh with: --events runs/seed-501.jsonl
preset = "primordia-2d-sun"
epochs = 1000000000

[world]
size = [501, 501]

[individual]
starve_after = 800
max_age = 6000
sleep_scale = 16
sleep_shield = false
sleep_absorb = 0.0
sleep_upkeep = 0.5

[energy]
share_beta = 0.125

[energy.sun]
i0 = 150
moon = 0.06

[energy.upkeep]
base = 3.5
per_byte = 0.12

[energy.vents]
enabled = true
count = 6
floor_only = false
drift = 0.01

[shielding]
s_bond = 0.4

[decay]
rate = 3e-4

[telemetry]
snapshot_every = 11000  # alternates midday / dawn
