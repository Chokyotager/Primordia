[package]
name = "primordia-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
primordia-core = { version = "0.1.0", path = "../primordia-core" }
primordia-gpu = { version = "0.1.0", path = "../primordia-gpu" }
primordia-telemetry = { version = "0.1.0", path = "../primordia-telemetry" }
primordia-view = { version = "0.1.0", path = "../primordia-view" }
serde_json = "1.0.154"
toml = "1.1.8"

[[bin]]
name = "primordia"
path = "src/main.rs"
